services:
  - type: web
    name: saathi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_NAME
        value: Saathi Voice Banking
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false   # Set this in Render dashboard — do NOT commit value
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false   # Set to your Vercel frontend URL e.g. https://saathi-payment.vercel.app
      - key: PAYMENT_THRESHOLD
        value: "5000"
      - key: PER_PAYMENT_LIMIT
        value: "10000"
      - key: DAILY_LIMIT
        value: "20000"
      - key: CONFIDENCE_THRESHOLD
        value: "0.78"
      - key: SPOOF_PROVIDER
        value: disabled
